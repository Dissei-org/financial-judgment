question: Would you expect Company CI to be relatively resilient if demand conditions weakened after the
  anchor?
prompt_template: 'Use the case materials available at the anchor to answer the question. Do not use information
  after the anchor.


  Timeline:

  {timeline}


  Exhibits:

  {exhibits}


  Sources:

  {sources}

  '
pld:
  excellent: A response at this level makes a clear forecast and weighs Company CI-specific demand durability
    against cyclical and operating vulnerabilities using only anchor-available evidence.
  adequate: A response at this level reaches a defensible forecast and supports it with the main pre-anchor
    evidence, while acknowledging at least one meaningful limitation.
  inadequate: A response at this level is on topic but relies on thin, generic, or one-sided reasoning
    that misses important evidence in the case materials.
  failing: A response at this level does not provide a usable Company CI-specific forecast, misuses the
    anchor, or bases the answer on unsupported assertions.
level_exemplars:
  excellent: 'One possible response at this level would expect Company CI to be relatively resilient,
    but not immune, if demand weakened after the anchor. It would start from the visible segment evidence:
    Exhibit 1 labels Company CI as Company CI and shows substantial North American positions across residential
    HVAC, Product F, refrigeration, and transport. It would add that the ledger-supported case materials
    identify Company CI as a leader in scroll compressors and controls. Those points support a forecast
    that volumes and margins should hold up better than many more exposed industrial businesses because
    customers appear to face meaningful substitution limits in several product categories.


    The same answer would not treat resilience as certainty. It would use the long historical table to
    show that Company CI had experienced revenue and EBITDA declines in downturn-like periods, so the
    right prediction is relative resilience rather than no contraction. It would also flag the cost side:
    the exhibit note attributes recent margin pressure to long-term OEM contracts with infrequent price
    adjustment terms, so weaker demand combined with cost pressure could squeeze margins before pricing
    catches up. The conclusion would be a balanced probabilistic call: Company CI should likely outperform
    a more exposed industrial peer set in a demand slowdown, but the company still has earnings sensitivity
    through volume, pricing lag, customer mix, and carve-out execution.

    '
  adequate: 'One possible response at this level would make a clear forecast that Company CI should be
    somewhat more resilient than a typical cyclical industrial business if demand conditions weakened
    after the anchor. The core reason is that the visible case materials show substantial positions in
    North American HVAC, refrigeration, and transport categories. Exhibit 1 labels Company CI as Company
    CI and shows meaningful segment positions across those categories, while the surrounding case materials
    describe the business as a leader in scroll compressors and controls. A reasonable inference is that
    customers would have fewer easy substitutes for key products, especially in residential compressors,
    where the ledger identifies Company CI as the only domestic supplier.


    The answer would still recognize limits. Exhibit 2 shows that the business has not been perfectly
    stable across cycles; both revenue and adjusted EBITDA have declined in some historical years, including
    periods that look like demand stress. That history makes a prediction of complete insulation too strong.
    The answer would also mention margin exposure from infrequent contract repricing. If demand weakens
    while cost inflation remains high, the company may have to absorb pressure before price adjustments
    catch up. The better calibrated answer is therefore not "no downside," but "relative resilience with
    earnings volatility." It should conclude that Company CI would probably withstand weaker demand better
    than many discretionary industrial businesses because of category position and product leadership,
    while still being exposed to cyclical volume declines and margin compression.

    '
  inadequate: 'One possible response at this level would answer that Company CI is probably resilient
    but would support the view mostly with generic claims about HVAC being necessary or Company ED being
    a sophisticated sponsor. It might mention that the company has a strong position, but it would not
    engage closely with Exhibit 1 or the historical financial table. It might also ignore the distinction
    between revenue resilience and EBITDA resilience, even though the case materials show that margins
    can move meaningfully when costs and pricing timing are unfavorable.


    This answer would be weak because it treats the conclusion as obvious. It would not wrestle with the
    evidence that Company CI had prior revenue and EBITDA declines, and it might fail to explain why those
    declines are consistent with a relative-resilience view rather than a recession-proof view. It may
    also overlook raw-material exposure and contract repricing lag, both of which matter if demand softens
    after the anchor. The final forecast may still be directionally plausible, but it would not give a
    judge enough case-based reasoning to distinguish a considered prediction from a broad industrial-market
    guess.

    '
  failing: 'One possible response at this level would either refuse to make a forecast or assert a conclusion
    that is detached from the case materials. It might say Company CI would definitely collapse because
    industrial demand is cyclical, or that it would have no downside because HVAC is essential, without
    using the exhibits or the ledger-supported operating facts. It might also rely on later transaction
    details, later macro data, or realized events after the anchor, which would make the answer unusable
    for an anchor-time prediction.


    Another failing response would confuse financing structure with demand resilience, treating leverage,
    sponsor identity, or deal size as the main answer to a question about how the business might behave
    if demand weakened. Those factors could matter to capital structure risk, but they do not by themselves
    show whether Company CI products, customers, and margins would be resilient. A failing answer would
    leave the reader without a grounded Company CI-specific view and would not separate relative resilience
    from absolute immunity.

    '
