question: Company ED is negotiating to acquire Company CI at a $14 billion enterprise value. Measured
  against how public equity markets value comparable HVAC manufacturers, is that entry price attractive?
prompt_template: 'You are advising Company ED deal team on the proposed Company CI from Company BR as
  of the deal-table discussions. Using only the case material provided, assess Company CI $14 billion
  entry valuation against the multiples of publicly traded HVAC manufacturers, and reach a view on whether
  the entry price is attractive.


  Ground every claim in the case evidence. Commit to a clear conclusion and explain the reasoning that
  supports it.


  Timeline:

  {timeline}


  Exhibits:

  {exhibits}


  Sources:

  {sources}'
pld:
  excellent: Commits to a clear positioning of the entry multiple versus HVAC OEM peers and to an attractiveness
    verdict, and reconciles the two by showing the comparable-to-cheaper multiple is largely warranted
    by Company CI weaker earnings-growth profile rather than a standalone bargain.
  adequate: Correctly compares the entry multiple to HVAC OEM peers and identifies the adverse EBITDA-growth
    differential, commits to a verdict, but reconciles the multiple and growth only loosely or leaves
    some figures approximate.
  inadequate: Notes the multiple and growth data but Company CI's higher revenue growth with earnings
    growth, leans on the wrong benchmark, or fails to commit to a clear attractiveness verdict.
  failing: Offers a generic sector or sponsor-quality take with no grounded peer-multiple comparison,
    or relies on information about how the deal turned out after the anchor.
level_exemplars:
  excellent: 'On the entry multiple, Company CI is being taken private at roughly 12.4x LTM / 13.4x NTM
    Adjusted EBITDA on a headline basis, or about 10.4x / 11.3x pro forma for identified synergies. That
    sits essentially in line with — and on a pro-forma basis modestly below — the ~12.9x LTM / ~13.2x
    NTM commanded by publicly traded HVAC OEM peers, and well below the ~19x LTM carried by higher-growth
    comparable margin industrials. On a pure multiple screen the price therefore looks unremarkable rather
    than rich. The growth differential reframes that read: Company CI two-year forward EBITDA growth of
    ~3.3% badly trails the ~7.2% peer average, and its five-year historical EBITDA growth of ~1.9% versus
    ~8.4% is worse still — even though Company CI revenue has grown faster than peers (~5.2% vs ~2.1%),
    margin compression from slow contractual price pass-through means that revenue lead has not reached
    the EBITDA line. A slower-compounding asset should trade at a discount, so the comparable-to-slightly-cheaper
    multiple is largely warranted compensation for weaker earnings growth, not a free bargain. My most-likely
    verdict: the entry price is fairly-to-fully priced given the growth profile — attractive only if Company
    ED can convert margin resilience, non-discretionary replacement demand, and identified cost savings
    into growth the public comps do not yet reflect. The HVAC OEM set, not the pricier industrials, is
    the right benchmark; anchoring to industrials would overstate the discount.'
  adequate: 'Company CI entry multiple is about 12.4x LTM and 13.4x NTM EBITDA on a headline basis, and
    around 10.4x / 11.3x pro forma. The publicly traded HVAC OEM peers trade at roughly 12.9x LTM and
    13.2x NTM, so Company CI is being bought at a level broadly in line with those peers, and a little
    cheaper once the pro-forma adjustment is applied. Against the comparable margin industrials at close
    to 19x LTM the deal looks much cheaper, but those industrials are faster-growing and are not the closest
    benchmark, so the HVAC OEM set is the more relevant comparison. On growth, Company CI looks weaker
    than the HVAC OEM peers on earnings: its two-year forward EBITDA growth is about 3.3% against roughly
    7.2% for peers, and its historical EBITDA growth of about 1.9% is well below the peer 8.4%. Company
    CI revenue growth of about 5.2% is actually higher than the peer 2.1%, but that has not translated
    into faster EBITDA growth because margins have been compressed by slow contractual price pass-through.
    Putting these together, the roughly in-line multiple is largely explained by the weaker earnings-growth
    profile: a business that compounds EBITDA more slowly should trade at a discount, so paying a peer-like
    multiple is not obviously a bargain. My most-likely conclusion is that the entry price is fairly priced
    rather than clearly attractive on the comparison alone; it becomes attractive only if the cost savings
    and resilient replacement demand deliver upside the public peers do not price. The comparison therefore
    turns less on the headline multiple and more on whether Company CI slower growth is temporary or structural.
    I would not call it expensive, but the growth gap means the modest multiple is warranted rather than
    a discount to intrinsic value.'
  inadequate: Company CI is being bought at around 12–13x EBITDA, which is roughly where HVAC companies
    trade, so the valuation seems fair. Company CI actually grows revenue faster than the HVAC peers —
    about 5.2% versus 2.1% — which suggests it is a better business, so paying a similar multiple could
    even be a good deal. The industrials comps trade near 19x, so relative to those Company CI looks quite
    cheap and the discount is real. Overall the price seems reasonable and probably attractive given the
    faster growth, though a lot depends on where the economy goes. It is hard to say definitively whether
    it is attractive without more detail on the eventual exit multiple.
  failing: Company CI is a compressor maker being carved out of Company BR. HVAC is a growing market because
    of electrification and climate demand, so almost any HVAC asset is attractive to own. Company ED is
    a large, disciplined firm and generally makes money on its deals, so the entry price is probably fine.
    Public HVAC stocks have performed well, which shows the sector is strong, and the transaction ultimately
    worked out well for the sponsor. On that basis I would say the entry price is attractive because the
    sector has good long-term tailwinds.
