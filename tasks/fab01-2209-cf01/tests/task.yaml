question: Had Company BR declined to roll equity and provide a seller note, how would Company ED have
  had to reshape the capital structure to close at the same price, and how would risk-sharing shift?
prompt_template: 'Use the case materials below to answer the question. Base your analysis only on information
  available by the anchor date.


  Timeline:

  {timeline}


  Exhibits:

  {exhibits}


  Sources:

  {sources}

  '
pld:
  excellent: Provides a case-grounded counterfactual financing plan that preserves the purchase-price
    premise, sizes the missing Company BR capital, tests replacement capacity against credit markets and
    borrower risk, and explains the resulting redistribution of economic and execution risk.
  adequate: Recognizes the missing seller-funded sources, proposes a plausible mix of replacement capital
    and economic concessions, and explains the main risk-sharing consequences with some evidence from
    the pre-anchor record.
  inadequate: Gives a generic financing answer that notices one missing instrument or one risk shift but
    does not size the problem, test financing feasibility, or connect the answer to Company CI-specific
    evidence.
  failing: Treats the counterfactual as a simple deletion or all-debt substitution, ignores the actual
    deal structure, or relies on unsupported assumptions and post-anchor information.
level_exemplars:
  excellent: 'One possible top-tier response would start from the actual pre-anchor structure rather than
    from a generic LBO template. The proposed deal had a $14.0 billion TEV (F041), $5.5BN of senior third-party
    debt at roughly 4.0x leverage (F043), a $2.25BN seller note (F047), $2.0BN of Company ED and co-investor
    convertible preferred with a 7% PIK rate and conversion at a 10% premium (F048), and common equity
    split 60/40 between Company ED and Company BR (F042). Company BK declined both rollover and seller-credit
    participation, Company ED would need to replace the seller note and Company BK as sources while keeping
    the purchase price intact, not simply remove them from uses. The most plausible reshaping would lean
    first on incremental sponsor and co-investor equity or preferred equity, potentially with a larger
    Company ED-led preferred/common check and perhaps modified conversion or priority terms, because the
    existing funded debt package was already a large all-senior structure and carried a first-lien net
    leverage covenant below 6.5x EBITDA (F045). Some incremental debt might be possible, but the answer
    would treat it as constrained and expensive, not as the default solution.


    The response would also explain why the debt market made a pure releveraging answer fragile. CLOs
    represented nearly two-thirds of institutional capital in the primary loan market (F039), while non-bank
    institutional participation had fallen 89% from Q1 2021 to Q3 2022 (F040). Against that backdrop,
    loading the entire missing Company BR capital into syndicated or direct loans would likely strain
    syndication, pricing, covenant, and interest-burden tolerance. The undrawn $700 million ABL (F057,
    F058) would be liquidity support rather than purchase-price financing. To close at the same nominal
    price, Company ED would therefore need some combination of more sponsor/co-invest equity, more junior
    preferred or structured equity, outside minority capital, or an economic concession such as deferred
    consideration that mimicked the seller note without pretending it was third-party debt.


    On risk-sharing, the response would make clear that Company BR''s withdrawal would reduce seller alignment
    and transfer more operating and exit downside to Company ED, co-investors, and lenders. In the actual
    structure, Company BR retained 40% common ownership (F050) and provided a seller note senior to preferred
    equity (F047), so it remained exposed above creditors but alongside the equity story. Without that
    participation, Company ED would own more of the downside and upside, lenders would face a less aligned
    seller, and any new junior capital would demand compensation through priority, PIK accrual, governance,
    or lower entry economics. The answer would also connect this shift to carve-out execution risk: Company
    CI depended on Company BR for 156 different services (F030), so a seller that no longer had capital
    at risk could be less economically aligned during separation. A strong answer would balance this against
    Company CI defensive traits, including roughly 80% replacement demand (F022), about 85% revenue from
    HVAC and refrigeration end markets (F023), product lives of 12-15 years (F025), and inflation pass-through
    delays of 6-18 months on many contracts (F021).

    '
  adequate: 'One possible adequate response would say that Company ED could still try to close, but only
    by replacing Company BR''s capital stack role with a mix of additional Company ED/co-investor capital,
    junior preferred equity, and perhaps a smaller amount of incremental debt or deferred seller-like
    consideration. The answer would identify that the actual structure did not merely have Company BR
    as a passive seller: it included a $2.25BN seller note (F047) and Company BR common equity participation
    for 40% ownership (F042, F050), while Company ED held the 60% common side (F042, F049). Company BK
    refused both instruments, the transaction would have a real sources problem at the same purchase price,
    so Company ED would need replacement financing rather than just deleting those rows.


    The response would then make a reasonable feasibility judgment. It would note that the proposed third-party
    debt was already $5.5BN of all senior debt at about 4.0x leverage (F043), with a first-lien net leverage
    covenant below 6.5x EBITDA (F045). That makes a full debt replacement aggressive. The answer would
    also use pre-anchor market conditions: CLOs were nearly two-thirds of institutional primary-market
    capital (F039), and non-bank institutional participation had declined 89% from Q1 2021 to Q3 2022
    (F040). Those facts support the view that direct lenders or banks might provide some capital, but
    probably only at higher cost, tighter terms, or in a smaller amount than the lost Company BR participation.
    The $700 million ABL could support liquidity but should not be treated as if it were drawn purchase
    consideration (F057, F058).


    On risk-sharing, an adequate answer would explain that Company BR''s refusal would leave less seller
    skin in the game and put more downside onto Company ED, co-investors, any new preferred investors,
    and lenders. The actual seller note was senior to preferred equity (F047), and Company BR''s rollover
    made it share future common-equity outcomes (F042). Without those features, Company ED might need
    to compensate new investors through seniority, PIK economics, conversion rights, governance, or a
    lower effective price. The answer would mention that this mattered because Company CI was not a clean
    public-company acquisition: it was a carve-out reliant on Company BR for 156 services (F030). It might
    also point to Company CI defensiveness, including roughly 80% replacement demand (F022) and about
    85% exposure to HVAC and refrigeration end markets (F023), while acknowledging inflation timing risk
    from 6-18 month pass-through delays (F021). This would be enough to show the main mechanics and risk
    shift, even if the response did not fully optimize each financing layer.

    '
  inadequate: 'One possible inadequate response would recognize that the deal would be harder Company
    BK did not participate, but it would answer mostly in generalities. It might say Company ED should
    "raise more debt and equity" and that risk would "shift to Company ED," but it would not clearly identify
    the actual instruments that disappeared: the $2.25BN seller note (F047) and Company BR''s 40% common
    participation (F042, F050). It might mention the $14.0 billion purchase price (F041) but fail to explain
    that maintaining that price requires replacing sources, not reducing uses.


    This response would also underdevelop feasibility. It might assume the full gap could be financed
    by lenders even though the actual structure already had $5.5BN of senior debt at roughly 4.0x leverage
    (F043), and it might ignore the covenant below 6.5x EBITDA (F045). It could cite rising rates or tighter
    credit in vague terms, but it would not use the available evidence that non-bank institutional participation
    had fallen 89% from Q1 2021 to Q3 2022 (F040) or that CLOs supplied nearly two-thirds of institutional
    primary-market capital (F039). It might misuse the $700 million ABL (F057) as if drawing it at close
    solved the acquisition financing instead of treating it as liquidity support.


    The risk-sharing discussion would be thin. The answer might say Company BR would have "less risk"
    without explaining that Company ED and co-investors would absorb more ownership exposure, that new
    junior capital would demand priority or pricing, or that lenders would face a less aligned seller.
    It might mention Company CI business quality, such as its replacement demand or HVAC exposure, but
    without connecting those facts to why investors might still finance a reshaped structure. It might
    also miss the carve-out issue that Company CI relied on Company BR for 156 services (F030), which
    is central to why seller participation mattered beyond dollars.

    '
  failing: 'One possible failing response would treat the counterfactual as a simple accounting edit.
    It might say Company ED could remove Company BR''s rollover and seller note and keep the same purchase
    price without explaining where replacement sources would come from. Alternatively, it might assert
    that banks could simply add the missing amount to the debt package, ignoring that the actual transaction
    already had $5.5BN of senior debt at roughly 4.0x leverage (F043), a first-lien leverage covenant
    below 6.5x EBITDA (F045), and difficult credit-market conditions.


    A failing response would not identify the seller note as a $2.25BN instrument (F047) or Company BR''s
    40% common ownership (F042, F050), and it would not distinguish senior debt, seller paper, preferred
    equity, common equity, and the ABL. It might confuse the $700 million revolver (F057) with acquisition
    proceeds even though it was expected to remain undrawn at closing (F058). Its risk-sharing claims
    would be conclusory, such as "Company ED takes more risk," without explaining loss of seller alignment,
    the altered priority stack, or the implications for lenders and new junior capital providers. It might
    also ignore Company CI-specific risk, including reliance on Company BR for 156 services (F030), and
    could use later developments as if they were known by September 30, 2022.

    '
